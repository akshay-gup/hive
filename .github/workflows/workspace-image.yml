name: Workspace image
# Builds the image a workspace runs (apps/workspace/Dockerfile) and pushes it to GitHub's container registry,
# so the Droplet snapshot (apps/control/tools/do-image.ts) can be made from a machine that has no Docker.
# The job summary says which image was pushed and the command that makes the snapshot from it.
on:
  push:
    # Only main builds. A second branch pushed together with it would build the same commit again, push it
    # under the same tag and leave the registry holding a different image than the one the release names.
    branches: [main]
    paths:
      - apps/workspace/**
      - apps/server/**
      - apps/control/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - .github/workflows/workspace-image.yml
  # Only listed in the Actions tab once this file is on the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the image (sha-<commit> when empty)
        required: false
permissions:
  contents: read
concurrency:
  group: workspace-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        env:
          TAG_INPUT: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-sha-${SHA::7}}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || { echo "Not a usable image tag: $tag" >&2; exit 1; }
          image="ghcr.io/${OWNER,,}/hive-workspace:${tag}"
          echo "image=$image" >> "$GITHUB_ENV"
          # The labels link the package to this repository, so its access follows the repository's.
          docker build --pull -f apps/workspace/Dockerfile \
            --build-arg "HIVE_VERSION=${tag}" \
            --label "org.opencontainers.image.source=https://github.com/${REPO}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            -t "$image" .
      - name: Check that it starts
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node "$image" --version
          docker run --rm --entrypoint opencode "$image" --version
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          # What the registry serves under the tag, asked the way a machine asks it (crane does the same),
          # since that is what the machine checks the build against. What docker keeps locally can name
          # a different object than the one that was pushed.
          repo="${image%:*}"
          repo="${repo#ghcr.io/}"
          bearer="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)"
          digest="$(curl -fsSI -H "Authorization: Bearer $bearer" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${image##*:}" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest from the registry: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_ENV"
          {
            echo "### Workspace image"
            echo
            echo "Pushed \`$image\` (\`$digest\`)."
            echo
            echo "Make the Droplet snapshot from it, with the registry login only if the package is private:"
            echo
            echo '```sh'
            echo "DO_API_TOKEN=… HIVE_REGISTRY_USER=… HIVE_REGISTRY_TOKEN=… \\"
            echo "  pnpm exec tsx apps/control/tools/do-image.ts --image $image --region nyc3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A push to main is a release: every workspace without a build of its own is told to run this one,
      # and updates itself within about twenty minutes (docs/workspace-updates.md). A push to another
      # branch only makes the image. Without the secret the step says so and does nothing, so a fork or a
      # repository not yet set up still builds. To stop machines moving, pause it on the control plane.
      - name: Tell the control plane
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_TOKEN: ${{ secrets.HIVE_RELEASE_TOKEN }}
          CONTROL_URL: ${{ vars.HIVE_CONTROL_URL || 'https://api.vi-ak.com' }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "HIVE_RELEASE_TOKEN is not set, so no workspace is told about this build."
            echo "No release token is set, so no workspace was told about this build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="${image##*:}"
          body="$(jq -nc --arg tag "$tag" --arg digest "$digest" '{tag: $tag, digest: $digest}')"
          curl -fsS -X PUT "$CONTROL_URL/internal/release" \
            -H "Authorization: Bearer $RELEASE_TOKEN" -H "Content-Type: application/json" \
            --data "$body"
          echo
          echo "Told $CONTROL_URL that every workspace should run \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
